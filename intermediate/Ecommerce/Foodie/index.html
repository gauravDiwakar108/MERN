<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/header-style.css">
    <link rel="stylesheet" href="style/section-style.css">
    <link rel="stylesheet" href="style/media-query.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Foodie</title>
</head>

<body>
    <!-- header part -->
    <header>
        <nav class="navbar flex between wrapper">
            <a href="" class="logo">Foodie.</a>

            <!-- DESKTOP MENU -->
            <ul class="navlist flex gap-3">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Servies</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contacts</a></li>
            </ul>

            <div class="desktop-action flex gap-2">
                <a href="#" class="cart-icon"><i class="fa-solid fa-bag-shopping" style="color: rgb(0, 0, 0);"></i>
                    <span class="cart-value">0</span></a>
                <a href="#" class="btn">Sign In &nbsp;<i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(0, 0, 0);"></i></a>
                <a href="#" class="hamburger"><i class="fa-solid fa-bars" style="color: rgb(0, 0, 0);"></i></a>
            </div>

            <!-- MOBILE MENU -->
            <ul class="mobile-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Servies</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contacts</a></li>
                <li><a href="#" class="btn">Sign In &nbsp;<i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(0, 0, 0);"></i></a></li>
            </ul>
        </nav>
    </header>

    <!-- section part -->
    <main>
        <section>
            <div class="hero-section flex wrapper gap-4">
                <div class="content">
                    <h1>Enjoy Your Delicious <span>Food</span></h1>
                    <p class="para">We will fill your tummy with delicious <br> food with fast delivery.</p>
                    <div class="flex gap-2">
                        <a href="#" class="btn">Order Now</a>
                        <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
                        <a href="#" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#" class="social-icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    </div>
                </div>

                <div class="image-container">
                    <img src="images/delivery-boy.png" alt="delivery-boy">
                </div>
            </div>
        </section>

        
    </main>

    <!-- footer part -->
    <footer>

    </footer>
</body>

</html>
